<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Music Player</title>
    <!-- Phosphor Icons for great UI icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <meta name="description" content="A premium web-based music player.">
</head>
<body>
    <div class="background-animation"></div>

    <div class="player-container">
        <!-- Sidebar / Playlist -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Playlist</h2>
                <div>
                    <label for="audio-upload" class="upload-btn">
                        <i class="ph ph-upload-simple"></i> Add
                    </label>
                    <input type="file" id="audio-upload" accept="audio/*" multiple hidden>
                </div>
            </div>

            <div class="search-container">
                <i class="ph ph-magnifying-glass search-icon"></i>
                <input type="text" id="search-input" placeholder="Search tracks...">
            </div>

            <ul class="playlist" id="playlist">
                <!-- Tracks will be dynamically injected here -->
                <li class="empty-state">No tracks added. Upload some music to get started!</li>
            </ul>
        </aside>

        <!-- Main View / Now Playing -->
        <main class="main-view">
            <div class="top-bar">
                <div class="brand">
                    <i class="ph-fill ph-waves"></i>
                    <span>Aura</span>
                </div>
                <button class="theme-toggle" id="theme-toggle" aria-label="Toggle Theme">
                    <i class="ph ph-sun" id="theme-icon"></i>
                </button>
            </div>

            <div class="now-playing-art">
                <div class="album-art" id="album-art">
                    <i class="ph-thin ph-music-notes"></i>
                </div>
            </div>

            <div class="track-info">
                <h1 id="track-title">Welcome to Aura</h1>
                <p id="track-artist">Select a track to start listening</p>
            </div>

            <div class="controls-container">
                <div class="progress-container">
                    <span id="current-time">0:00</span>
                    <input type="range" id="progress-bar" value="0" min="0" max="100" step="0.1">
                    <span id="total-time">0:00</span>
                </div>

                <div class="playback-controls">
                    <div class="volume-container">
                        <button id="mute-btn" aria-label="Mute">
                            <i class="ph ph-speaker-high" id="volume-icon"></i>
                        </button>
                        <input type="range" id="volume-slider" value="100" min="0" max="100">
                    </div>

                    <div class="main-buttons">
                        <button id="prev-btn" class="control-btn" aria-label="Previous Track">
                            <i class="ph-fill ph-skip-back"></i>
                        </button>
                        <button id="play-btn" class="control-btn play-btn" aria-label="Play/Pause">
                            <i class="ph-fill ph-play" id="play-icon"></i>
                        </button>
                        <button id="next-btn" class="control-btn" aria-label="Next Track">
                            <i class="ph-fill ph-skip-forward"></i>
                        </button>
                    </div>

                    <div class="extra-controls">
                         <button id="loop-btn" class="control-btn small-btn" aria-label="Toggle Loop">
                            <i class="ph ph-repeat"></i>
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Hidden native audio element -->
    <audio id="audio-element"></audio>

    <script src="script.js"></script>
</body>
</html>
